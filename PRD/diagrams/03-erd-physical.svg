<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" font-family="'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000000"/></marker><marker id="opn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect x="30" y="30" width="240" height="182" rx="4" fill="#fff" stroke="#000000" stroke-width="1.3"/><path d="M30 58 V34 a4 4 0 0 1 4 -4 H266 a4 4 0 0 1 4 4 V58 z" fill="#e6e6e6" stroke="#000000" stroke-width="1.3"/><text x="150" y="49" font-size="13" text-anchor="middle" font-weight="600" fill="#000000">visit_days</text><text x="38" y="73" font-size="12" fill="#000000" font-weight="600">PK  day : date</text><line x1="30" y1="80" x2="270" y2="80" stroke="#cccccc"/><text x="38" y="95" font-size="12" fill="#000000">visits : int</text><line x1="30" y1="102" x2="270" y2="102" stroke="#cccccc"/><text x="38" y="117" font-size="12" fill="#000000">qr : int</text><line x1="30" y1="124" x2="270" y2="124" stroke="#cccccc"/><text x="38" y="139" font-size="12" fill="#000000">link : int</text><line x1="30" y1="146" x2="270" y2="146" stroke="#cccccc"/><text x="38" y="161" font-size="12" fill="#000000">views : int</text><line x1="30" y1="168" x2="270" y2="168" stroke="#cccccc"/><text x="38" y="183" font-size="12" fill="#000000">plays : int</text><line x1="30" y1="190" x2="270" y2="190" stroke="#cccccc"/><text x="38" y="205" font-size="12" fill="#000000">completes : int</text><rect x="300" y="30" width="240" height="138" rx="4" fill="#fff" stroke="#000000" stroke-width="1.3"/><path d="M300 58 V34 a4 4 0 0 1 4 -4 H536 a4 4 0 0 1 4 4 V58 z" fill="#e6e6e6" stroke="#000000" stroke-width="1.3"/><text x="420" y="49" font-size="13" text-anchor="middle" font-weight="600" fill="#000000">dish_views</text><text x="308" y="73" font-size="12" fill="#000000" font-weight="600">PK  dish_id : text</text><line x1="300" y1="80" x2="540" y2="80" stroke="#cccccc"/><text x="308" y="95" font-size="12" fill="#000000">views : int</text><line x1="300" y1="102" x2="540" y2="102" stroke="#cccccc"/><text x="308" y="117" font-size="12" fill="#000000">plays : int</text><line x1="300" y1="124" x2="540" y2="124" stroke="#cccccc"/><text x="308" y="139" font-size="12" fill="#000000">plays_short : int</text><line x1="300" y1="146" x2="540" y2="146" stroke="#cccccc"/><text x="308" y="161" font-size="12" fill="#000000">completes : int</text><rect x="570" y="30" width="220" height="116" rx="4" fill="#fff" stroke="#000000" stroke-width="1.3"/><path d="M570 58 V34 a4 4 0 0 1 4 -4 H786 a4 4 0 0 1 4 4 V58 z" fill="#e6e6e6" stroke="#000000" stroke-width="1.3"/><text x="680" y="49" font-size="13" text-anchor="middle" font-weight="600" fill="#000000">lang_stats</text><text x="578" y="73" font-size="12" fill="#000000" font-weight="600">PK  lang : text</text><line x1="570" y1="80" x2="790" y2="80" stroke="#cccccc"/><text x="578" y="95" font-size="12" fill="#000000">views : int</text><line x1="570" y1="102" x2="790" y2="102" stroke="#cccccc"/><text x="578" y="117" font-size="12" fill="#000000">plays : int</text><line x1="570" y1="124" x2="790" y2="124" stroke="#cccccc"/><text x="578" y="139" font-size="12" fill="#000000">completes : int</text><rect x="30" y="290" width="240" height="72" rx="4" fill="#fff" stroke="#000000" stroke-width="1.3"/><path d="M30 318 V294 a4 4 0 0 1 4 -4 H266 a4 4 0 0 1 4 4 V318 z" fill="#e6e6e6" stroke="#000000" stroke-width="1.3"/><text x="150" y="309" font-size="13" text-anchor="middle" font-weight="600" fill="#000000">feature_uses</text><text x="38" y="333" font-size="12" fill="#000000" font-weight="600">PK  feature : text</text><line x1="30" y1="340" x2="270" y2="340" stroke="#cccccc"/><text x="38" y="355" font-size="12" fill="#000000">uses : int</text><rect x="300" y="250" width="250" height="160" rx="4" fill="#fff" stroke="#000000" stroke-width="1.3"/><path d="M300 278 V254 a4 4 0 0 1 4 -4 H546 a4 4 0 0 1 4 4 V278 z" fill="#e6e6e6" stroke="#000000" stroke-width="1.3"/><text x="425" y="269" font-size="13" text-anchor="middle" font-weight="600" fill="#000000">presence</text><text x="308" y="293" font-size="12" fill="#000000" font-weight="600">PK  device_id : text</text><line x1="300" y1="300" x2="550" y2="300" stroke="#cccccc"/><text x="308" y="315" font-size="12" fill="#000000">last_seen : timestamptz</text><line x1="300" y1="322" x2="550" y2="322" stroke="#cccccc"/><text x="308" y="337" font-size="12" fill="#000000">path : text</text><line x1="300" y1="344" x2="550" y2="344" stroke="#cccccc"/><text x="308" y="359" font-size="12" fill="#000000">source : text  ('qr' | 'link')</text><line x1="300" y1="366" x2="550" y2="366" stroke="#cccccc"/><text x="308" y="381" font-size="12" fill="#000000">lang : text</text><line x1="300" y1="388" x2="550" y2="388" stroke="#cccccc"/><text x="308" y="403" font-size="12" fill="#000000">listening : text</text><rect x="570" y="190" width="220" height="150" rx="8" fill="#f2f2f2" stroke="#000000" stroke-width="1.3"/><text x="680" y="234.5" font-size="11" text-anchor="middle" fill="#000000">Hàm SQL (RPC, tăng bộ đếm)</text><text x="680" y="248.2" font-size="11" text-anchor="middle" fill="#000000">record_visit(day, source)</text><text x="680" y="262.0" font-size="11" text-anchor="middle" fill="#000000">record_dish_view(day, dish, lang)</text><text x="680" y="275.7" font-size="11" text-anchor="middle" fill="#000000">record_play(day, dish, lang, short)</text><text x="680" y="289.5" font-size="11" text-anchor="middle" fill="#000000">record_complete(day, dish, lang)</text><text x="680" y="303.2" font-size="11" text-anchor="middle" fill="#000000">record_feature(key)</text><text x="30" y="437.0" font-size="12" text-anchor="start" fill="#000000">Ghi chú</text><text x="30" y="454.4" font-size="12" text-anchor="start" fill="#000000">- Mỗi bảng là một bộ đếm tổng hợp; các bảng không liên kết bằng khóa ngoại. Dữ liệu đếm tăng nguyên tử qua hàm SQL (INSERT ...</text><text x="30" y="471.8" font-size="12" text-anchor="start" fill="#000000">ON CONFLICT DO UPDATE).</text><text x="30" y="489.2" font-size="12" text-anchor="start" fill="#000000">- visit_days: một dòng mỗi ngày (giờ Việt Nam). dish_views: một dòng mỗi món. lang_stats: một dòng mỗi ngôn ngữ.</text><text x="30" y="506.6" font-size="12" text-anchor="start" fill="#000000">- feature_uses: khóa dạng near_me, near_listen, glossary:&lt;id&gt;:term, glossary:&lt;id&gt;:meaning.</text><text x="30" y="524.0" font-size="12" text-anchor="start" fill="#000000">- presence: một dòng mỗi tab đang mở, làm mới mỗi 8 giây; coi là online nếu last_seen trong 15 giây; dòng cũ hơn 1 giờ bị dọn.</text><text x="30" y="541.4" font-size="12" text-anchor="start" fill="#000000">- Cả 5 bảng bật Row Level Security; chỉ server (secret key) đọc và ghi.</text></svg>