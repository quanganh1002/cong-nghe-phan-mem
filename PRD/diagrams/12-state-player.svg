<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" font-family="'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000000"/></marker><marker id="opn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><circle cx="45" cy="70" r="9" fill="#000"/><rect x="20" y="170" width="150" height="64" rx="16" fill="#ebebeb" stroke="#000000" stroke-width="1.3"/><text x="95" y="198.7" font-size="12" text-anchor="middle" fill="#000000">Dừng</text><text x="95" y="213.7" font-size="12" text-anchor="middle" fill="#000000">(chưa phát)</text><rect x="330" y="150" width="190" height="84" rx="16" fill="#e6e6e6" stroke="#000000" stroke-width="1.3"/><text x="425" y="188.7" font-size="12" text-anchor="middle" fill="#000000">Đang đọc câu i</text><text x="425" y="203.7" font-size="12" text-anchor="middle" fill="#000000">do: giữ màn hình sáng</text><rect x="330" y="380" width="190" height="64" rx="16" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><text x="425" y="416.2" font-size="12" text-anchor="middle" fill="#000000">Tạm dừng</text><circle cx="60" cy="330" r="11" fill="#fff" stroke="#000" stroke-width="1.5"/><circle cx="60" cy="330" r="7" fill="#000"/><text x="570" y="161.0" font-size="11" text-anchor="start" fill="#000000">Mỗi lần ở trạng thái &quot;Đang đọc&quot;,</text><text x="570" y="176.9" font-size="11" text-anchor="start" fill="#000000">hệ thống đọc một câu; khi câu kết</text><text x="570" y="192.9" font-size="11" text-anchor="start" fill="#000000">thúc (onend) thì tự chuyển sang</text><text x="570" y="208.8" font-size="11" text-anchor="start" fill="#000000">câu kế tiếp. Chọn câu, câu</text><text x="570" y="224.8" font-size="11" text-anchor="start" fill="#000000">trước/sau và đổi tốc độ đều đọc</text><text x="570" y="240.8" font-size="11" text-anchor="start" fill="#000000">lại từ câu được chọn.</text><polyline points="48.2,78.4 82.9,170.0" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#blk)"/><polyline points="170.0,190.0 330.0,180.0" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#blk)"/><polyline points="330.0,218.0 170.0,218.0" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#blk)"/><polyline points="380.0,234.0 380.0,380.0" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#blk)"/><polyline points="470.0,380.0 470.0,234.0" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#blk)"/><polyline points="330.0,412.0 110.0,412.0 110.0,234.0" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#blk)"/><polyline points="60.0,234.0 60.0,319.0" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#blk)"/><polyline points="387.0,150.0 387.0,116.0 463.0,116.0 463.0,150.0" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#blk)"/><rect x="185.0" y="134.0" width="130" height="32" fill="#fff" opacity="0.92"/><text x="250.0" y="147.0" font-size="11" text-anchor="middle" fill="#000000">speak(câu, ngôn ngữ)</text><text x="250.0" y="160.7" font-size="11" text-anchor="middle" fill="#000000">/ ghi lượt nghe</text><rect x="209.0" y="236.0" width="82" height="32" fill="#fff" opacity="0.92"/><text x="250.0" y="249.0" font-size="11" text-anchor="middle" fill="#000000">hết câu cuối</text><text x="250.0" y="262.7" font-size="11" text-anchor="middle" fill="#000000">hoặc stop()</text><rect x="319.0" y="298.0" width="52" height="18" fill="#fff" opacity="0.92"/><text x="345.0" y="310.9" font-size="11" text-anchor="middle" fill="#000000">pause()</text><rect x="476.0" y="298.0" width="58" height="18" fill="#fff" opacity="0.92"/><text x="505.0" y="310.9" font-size="11" text-anchor="middle" fill="#000000">resume()</text><rect x="197.0" y="395.0" width="46" height="18" fill="#fff" opacity="0.92"/><text x="220.0" y="407.9" font-size="11" text-anchor="middle" fill="#000000">stop()</text><rect x="60.0" y="273.0" width="64" height="18" fill="#fff" opacity="0.92"/><text x="92.0" y="285.9" font-size="11" text-anchor="middle" fill="#000000">rời trang</text><rect x="324.0" y="80.0" width="202" height="32" fill="#fff" opacity="0.92"/><text x="425.0" y="93.0" font-size="11" text-anchor="middle" fill="#000000">onend: câu i+1 | next() | prev()</text><text x="425.0" y="106.7" font-size="11" text-anchor="middle" fill="#000000">seek(i) | setSpeed(s)</text></svg>