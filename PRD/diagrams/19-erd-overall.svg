<line x1="730" y1="860" x2="990" y2="860" stroke="#bbb"/>
<text x="738" y="875" font-size="12">uses : int</text>
<text x="30" y="966" font-size="12" font-weight="700">Ghi chú</text>
<text x="30" y="983" font-size="12">- Nét liền: quan hệ giữa dữ liệu nội dung trong mã nguồn (đầu chân chim = nhiều; thanh + vòng tròn = 0..1).</text>
<text x="30" y="1000" font-size="12">- Nét đứt: tham chiếu logic từ bảng Supabase tới thực thể nội dung (mũi tên chỉ về thực thể được tham chiếu); không có khóa ngoại vật lý.</text>
<text x="30" y="1017" font-size="12">- 5 bảng Supabase là các bộ đếm tổng hợp, không liên kết với nhau bằng khóa ngoại; presence.source là nguồn vào mà visit_days.qr/link cộng dồn.</text>
<text x="30" y="1034" font-size="12">- Dish, Region, Category, PhotoCredit, GlossaryTerm, Language nằm trong mã nguồn nên không có bảng trong Supabase; Region/Category/Language là tập giá trị cố định.</text>
<text x="30" y="1051" font-size="12">- Bản dịch dựng sẵn: public/translations/&lt;ngôn ngữ&gt;.json, dạng {chuỗi tiếng Anh: bản dịch}.</text>
<text x="30" y="1068" font-size="12">- feature_uses.feature có dạng near_me, near_listen, glossary:&lt;id&gt;:term | meaning; phần &lt;id&gt; tham chiếu GlossaryTerm.id.</text>
</svg>